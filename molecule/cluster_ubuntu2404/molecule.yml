---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: mongo1
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - mongo_master
  - name: mongo2
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - mongo_replicas
  - name: mongo3
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - mongo_replicas
provisioner:
  name: ansible
  config_options:
    defaults:
      pipelining: true
  log: true
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
  env:
    MONGODB_VERSION: "8.0"
    MONGODB_PACKAGE: "mongodb-org"
    AUTH_STATE: "enabled"
    REPLICASET: "testrs"
  inventory:
    host_vars:
      mongo1:
        ansible_python_interpreter: auto_silent
        mongodb_master: true
        mongodb_replication_params:
          - host_name: "{{ hostvars[inventory_hostname].ansible_default_ipv4.address }}"
      mongo2:
        ansible_python_interpreter: auto_silent
        mongodb_replication_params:
          - host_name: "{{ hostvars[inventory_hostname].ansible_default_ipv4.address }}"
      mongo3:
        ansible_python_interpreter: auto_silent
        mongodb_replication_params:
          - host_name: "{{ hostvars[inventory_hostname].ansible_default_ipv4.address }}"
verifier:
  name: ansible
