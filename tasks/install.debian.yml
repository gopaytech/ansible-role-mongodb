---
- name: Establish some role-related facts
  set_fact:
    mongodb_major_version: "{{ mongodb_version[0:3] | string }}"

- name: Disable transparent huge pages on systemd systems
  include_tasks: disable_transparent_hugepages.yml
  when:
    - mongodb_disable_transparent_hugepages | bool
    - ansible_facts['service_mgr'] == "systemd"

- name: Fail when used wrong mongodb_version variable
  fail:
    msg: "mongodb_version variable should be '3.2', '3.6', '4.0', '4.2', '4.4', '5.0', '6.0', '7.0' or '8.0'"
  when: (mongodb_package == 'mongodb-org' and
        (mongodb_version is not defined
         or mongodb_repository[mongodb_major_version] is not defined))

# Older versions of this role used the apt_repository module, which wrote a
# legacy one-line ".list" file with no Signed-By. That conflicts with the
# deb822 source below (which sets Signed-By), so remove any such leftover.
- name: Find legacy MongoDB APT list files
  find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: ".*repo\\.mongodb\\.org.*"
  register: mongodb_legacy_list_files
  ignore_errors: true
  when: mongodb_package == 'mongodb-org'

- name: Remove legacy MongoDB APT list files (superseded by deb822 source)
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ mongodb_legacy_list_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: mongodb_package == 'mongodb-org'

- name: Update APT cache after removing the mongodb apt files
  apt:
    update_cache: true

# Replaces the deprecated apt_key + apt_repository modules with a single
# deb822_repository source. The GPG key is fetched from the MongoDB key URL
# and stored in its own keyring (signed_by), instead of the global trusted.gpg.
- name: Add MongoDB APT repository
  deb822_repository:
    name: "mongodb-org-{{ mongodb_major_version }}"
    types: deb
    uris: "{{ mongodb_repository_uri }}"
    suites: "{{ ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_major_version }}"
    components: "{{ mongodb_repository_component }}"
    signed_by: "{{ mongodb_apt_key_url[mongodb_major_version] }}"
    state: present
    enabled: true
  register: mongodb_apt_repo
  when: mongodb_package == 'mongodb-org'

- name: Update APT cache after adding MongoDB repository
  apt:
    update_cache: true
  when:
    - mongodb_package == 'mongodb-org'
    - mongodb_apt_repo is changed

- name: Install MongoDB package
  apt:
    name: "{{ mongodb_package }}{% if (mongodb_version | length > 3) %}={{ mongodb_version }}{% endif %}"
    state: "{{ mongodb_package_state }}"
    update_cache: true

- name: Check if NUMA is available on host
  command: "ls -1 /proc/1/numa_maps"
  register: numa_available
  ignore_errors: true
  changed_when: false
  check_mode: no
  when: mongodb_use_numa | bool

- name: Don't use NUMA if it is unavailable on host
  set_fact:
    mongodb_use_numa: false
  when: (mongodb_use_numa | bool and numa_available.rc != 0)

- name: Install numactl package
  apt:
    name: numactl
    state: present
  when: mongodb_use_numa | bool

- name: Add systemd configuration if present
  template:
    src: mongodb.service.j2
    dest: "/lib/systemd/system/{{ mongodb_daemon_name }}.service"
    owner: root
    group: root
    mode: '0644'
  when:
    - ansible_facts['service_mgr'] == "systemd"
    - mongodb_manage_systemd_unit | bool
  notify:
    - reload systemd

- name: Add symlink for systemd
  file:
    src: "/lib/systemd/system/{{ mongodb_daemon_name }}.service"
    dest: "/etc/systemd/system/multi-user.target.wants/{{ mongodb_daemon_name }}.service"
    state: link
  when:
    - ansible_facts['service_mgr'] == "systemd"
    - mongodb_manage_systemd_unit | bool
  notify:
    - reload systemd

# Workaround for the idempotence issue on Debian 10 with pip module
- name: Forcefully set mongodb_pymongo_from_pip to false on Debian 10
  set_fact:
    mongodb_pymongo_from_pip: false
  when:
    - ansible_facts['distribution'] == 'Debian'
    - ansible_facts['distribution_release'] == 'buster'

# Always use apt for Ubuntu 24 and newer to ensure compatibility
- name: Forcefully set mongodb_pymongo_from_pip to false on Ubuntu 24+
  set_fact:
    mongodb_pymongo_from_pip: false
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - ansible_facts['distribution_major_version'] | int >= 24

- name: Install PyMongo package
  apt:
    name: "{{ mongodb_pymongo_package }}"
    state: present
    update_cache: true
  when: not mongodb_pymongo_from_pip

- name: Install PIP
  apt:
    pkg: "{{ mongodb_pymongo_deps }}"
  when:
    - mongodb_pymongo_from_pip | bool
    - not (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] | int >= 24)

# TODO: check if it is still needed for Debian/Ubuntu
- name: Install setuptools (required for ansible 2.7+)
  apt:
    pkg: "{{ mongodb_python_setuptools }}"
  when:
    - mongodb_pymongo_from_pip | bool
    - not (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] | int >= 24)

- name: Install PyMongo from PIP
  pip:
    name:
      - pymongo
    state: "{{ mongodb_pymongo_pip_version is defined | ternary('present', 'latest') }}"
    version: "{{ mongodb_pymongo_pip_version | default(omit) }}"
    executable: "{{ mongodb_pip_executable }}"
  when:
    - mongodb_pymongo_from_pip | bool
    - not (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] | int >= 24)

- name: Install looseversion from PIP
  pip:
    name: looseversion
    executable: "{{ mongodb_pip_executable }}"
  when:
    - mongodb_pymongo_from_pip | bool
    - not (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] | int >= 24)

- name: Install looseversion from APT
  apt:
    name: python3-looseversion
    state: present
    update_cache: yes
  when:
    - not (mongodb_pymongo_from_pip | bool)
    - ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] | int >= 24
