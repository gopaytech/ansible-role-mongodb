---
- hosts: all
  remote_user: root
  become: yes
  tasks:
    - name: Install prerequisite packages for molecule testing on Ubuntu
      apt:
        update_cache: true
        name:
          - gpg
          - dirmngr
          - curl
          - gnupg

    - name: Restore the PEP 668 marker the image strips
      copy:
        dest: /usr/lib/python3.12/EXTERNALLY-MANAGED
        content: |
          [externally-managed]
          Error=This environment is externally managed
