---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check mongod service is running
      service_facts:

    - name: Assert mongod is running
      assert:
        that:
          - ansible_facts.services['mongod.service'].state == 'running'
        fail_msg: "mongod service is not running"

    - name: Check replica set status
      command: >
        mongosh --quiet -u siteRootAdmin -p passw0rd --eval 'rs.status().ok'
      register: rs_status
      changed_when: false

    - name: Assert replica set is OK
      assert:
        that:
          - rs_status.stdout | trim == '1'
        fail_msg: "Replica set status is not OK"

    - name: Check replica set members count
      command: >
        mongosh --quiet -u siteRootAdmin -p passw0rd --eval 'rs.status().members.length'
      register: rs_members
      changed_when: false
      when: mongodb_master is defined and mongodb_master

    - name: Assert replica set has 3 members
      assert:
        that:
          - rs_members.stdout | trim | int == 3
        fail_msg: "Expected 3 replica set members, got {{ rs_members.stdout | trim }}"
      when: mongodb_master is defined and mongodb_master

    - name: Check pymongo version is 4.x
      command: python3 -c "import pymongo; print(pymongo.version)"
      register: pymongo_ver
      changed_when: false

    - name: Assert pymongo 4.x is installed
      assert:
        that:
          - pymongo_ver.stdout is version('4.0', '>=')
        fail_msg: "Expected pymongo 4.x, got {{ pymongo_ver.stdout }}"
