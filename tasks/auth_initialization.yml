---
- name: Use different mongod.conf for auth initialization
  template:
    src: mongod_init.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - mongodb restart
    - wait when mongodb is started on localhost

- name: Flush all handlers at this point
  meta: flush_handlers

- name: Test MongoDB connection before creating users
  mongodb_info:
    login_host: "{{ mongodb_login_host | default(mongodb_net_bindip.split(',') | map('replace', '0.0.0.0', '127.0.0.1') | list | first) }}"
    login_port: "{{ mongodb_net_port | int }}"
  register: mongodb_connection_test
  ignore_errors: true

- name: Display MongoDB connection status
  debug:
    msg: "MongoDB connection status: {{ 'SUCCESS' if mongodb_connection_test.failed is not defined else 'FAILED - ' + mongodb_connection_test.msg }}"

- name: Debug IP addresses being used
  debug:
    msg: 
      - "mongodb_net_bindip: {{ mongodb_net_bindip }}"
      - "Resolved login_host: {{ mongodb_login_host | default(mongodb_net_bindip.split(',') | map('replace', '0.0.0.0', '127.0.0.1') | list | first) }}"
      - "mongodb_login_host (if set): {{ mongodb_login_host | default('NOT SET') }}"

- name: create administrative user "{{ mongodb_user_admin_name }}"
  community.general.mongodb_user:
    database: admin
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    update_password: "{{ mongodb_user_update_password }}"
    roles: "{{ item.roles }}"
    login_host: "{{ mongodb_login_host | default(mongodb_net_bindip.split(',') | map('replace', '0.0.0.0', '127.0.0.1') | list | first) }}"
    login_port: "{{ mongodb_net_port | int }}"
  with_items:
    - {
      name: "{{ mongodb_user_admin_name }}",
      password: "{{ mongodb_user_admin_password }}",
      roles: "userAdminAnyDatabase"
      }
  no_log: false
  register: user_admin_result
  ignore_errors: true

- name: Display user admin creation result (without sensitive data)
  debug:
    msg: "User admin creation: {{ 'SUCCESS' if user_admin_result.failed is not defined else 'FAILED - Check MongoDB logs' }}"

- name: create administrative user "{{ mongodb_root_admin_name }}"
  community.general.mongodb_user:
    database: admin
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    update_password: "{{ mongodb_user_update_password }}"
    roles: "{{ item.roles }}"
    login_host: "{{ mongodb_login_host | default(mongodb_net_bindip.split(',') | map('replace', '0.0.0.0', '127.0.0.1') | list | first) }}"
    login_port: "{{ mongodb_net_port | int }}"
  with_items:
    - {
      name: "{{ mongodb_root_admin_name }}",
      password: "{{ mongodb_root_admin_password }}",
      roles: "root"
      }
  no_log: false
  register: root_admin_result
  ignore_errors: true

- name: Display root admin creation result (without sensitive data)
  debug:
    msg: "Root admin creation: {{ 'SUCCESS' if root_admin_result.failed is not defined else 'FAILED - Check MongoDB logs' }}"

- name: create backup user "{{ mongodb_root_backup_name }}"
  community.general.mongodb_user:
    database: admin
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    update_password: "{{ mongodb_user_update_password }}"
    roles: "{{ item.roles }}"
    login_host: "{{ mongodb_login_host | default(mongodb_net_bindip.split(',') | map('replace', '0.0.0.0', '127.0.0.1') | list | first) }}"
    login_port: "{{ mongodb_net_port | int }}"
  with_items:
    - {
      name: "{{ mongodb_root_backup_name }}",
      password: "{{ mongodb_root_backup_password }}",
      roles: "backup,clusterMonitor"
      }
  no_log: true
  register: backup_user_result
  ignore_errors: true

- name: Display backup user creation result (without sensitive data)
  debug:
    msg: "Backup user creation: {{ 'SUCCESS' if backup_user_result.failed is not defined else 'FAILED - Check MongoDB logs' }}"

- name: Test if admin user can authenticate
  mongodb_info:
    login_host: "{{ mongodb_login_host | default(mongodb_net_bindip.split(',') | map('replace', '0.0.0.0', '127.0.0.1') | list | first) }}"
    login_port: "{{ mongodb_net_port | int }}"
    login_user: "{{ mongodb_root_admin_name }}"
    login_password: "{{ mongodb_root_admin_password }}"
    login_database: "admin"
  register: admin_auth_test
  ignore_errors: true
  no_log: true

- name: Display admin authentication test result
  debug:
    msg: "Admin user authentication: {{ 'SUCCESS' if admin_auth_test.failed is not defined else 'FAILED - User may not exist or wrong credentials' }}"

- name: Move back mongod.conf
  template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - mongodb restart
    - wait when mongodb is started

- name: Flush all handlers at this point
  meta: flush_handlers
